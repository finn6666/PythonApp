# CryptoApp nginx rate-limit zones
# Place in /etc/nginx/conf.d/ — automatically included by nginx.conf's
# 'include /etc/nginx/conf.d/*.conf' directive (http context).
#
# Setup:
#   sudo cp ~/CryptoApp/deploy/nginx-rate-limit.conf /etc/nginx/conf.d/
#   sudo nginx -t && sudo systemctl reload nginx

# Per-IP general request rate: 10 req/s sustained, 30 burst (nodelay drops excess)
limit_req_zone $binary_remote_addr zone=cryptoapp_main:10m rate=10r/s;

# Return 429 rather than the default 503 when rate exceeded
limit_req_status 429;
